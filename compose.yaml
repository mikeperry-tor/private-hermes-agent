name: private-hermes

# Derived pinned Hermes; the official base/source pin lives in its Dockerfile.
x-hermes-image: &hermes-image private-hermes-agent:local
x-hermes-build: &hermes-build
  context: .
  dockerfile: components/hermes/Dockerfile

x-deployment:
  onion_enabled: "${TOR_ONION_ENABLED:-false}"
  funnel_enabled: "${TAILSCALE_FUNNEL_ENABLED:-false}"
  webapp_bind: "${WEBAPP_BIND:-127.0.0.1}"
  webapp_port: "${WEBAPP_PORT:-9120}"
  terminal_environment: "${WEBAPP_TERMINAL_ENVIRONMENT-code}"
  external_content: "${WEBAPP_EXTERNAL_CONTENT-tor_proxied}"
  webapp_username: "${WEBAPP_USERNAME:-admin}"
  funnel_host: "${TAILSCALE_FUNNEL_HOST:-}"
  funnel_port: "${TAILSCALE_FUNNEL_PORT:-443}"
  tailscale_hostname: "${TAILSCALE_HOSTNAME:-private-hermes}"

x-isolated: &isolated
  internal: true
  driver_opts:
    com.docker.network.bridge.gateway_mode_ipv4: isolated
    com.docker.network.bridge.gateway_mode_ipv6: isolated

x-network: &network
  image: private-hermes-network:local
  build:
    context: .
    dockerfile: components/network/Dockerfile
  cap_drop: [ALL]
  cap_add: [NET_ADMIN, SETUID, SETGID, SETPCAP]
  security_opt: [no-new-privileges:true]
  read_only: true
  tmpfs: [/tmp:mode=1777]
  restart: unless-stopped
  healthcheck:
    test: [CMD, test, -f, /tmp/network-ready]
    interval: 10s
    start_interval: 1s
    timeout: 2s
    retries: 3
    start_period: 20s

services:
  setup: &setup-job
    image: *hermes-image
    build: *hermes-build
    user: "0:0"
    init: true
    network_mode: none
    working_dir: /opt/hermes
    entrypoint: [/opt/hermes/.venv/bin/python, /opt/private-hermes/provisioning/setup.py]
    command: [init]
    cap_drop: [ALL]
    cap_add: [CHOWN, FOWNER, DAC_OVERRIDE]
    security_opt: [no-new-privileges:true]
    read_only: true
    tmpfs: [/tmp:mode=1777]
    environment:
      WEBAPP_USERNAME: ${WEBAPP_USERNAME:-admin}
      HERMES_DEFAULT_MODEL: ${HERMES_DEFAULT_MODEL:-}
      WEBAPP_EXTERNAL_CONTENT: ${WEBAPP_EXTERNAL_CONTENT-tor_proxied}
      HERMES_HOME: /opt/data
      # Root provisioning must never execute tools from the writable profile.
      PATH: /opt/hermes/bin:/opt/hermes/.venv/bin:/usr/local/sbin:/usr/local/bin:/usr/sbin:/usr/bin:/sbin:/bin
    volumes:
      - hermes-data:/opt/data
      - x402_treazury-data:/var/lib/x402
      # Only the trusted, networkless setup service sees the parent.
      - type: bind
        source: ./data
        target: /persistent-data
        bind: {create_host_path: false}
      - type: bind
        source: ./components
        target: /opt/private-hermes
        read_only: true
        bind: {create_host_path: false}
      - type: bind
        source: ./config/webapp
        target: /run/webapp
        read_only: true
        bind: {create_host_path: false}

  setup-storage:
    <<: *setup-job
    profiles: [maintenance]
    command: [storage]
    environment:
      HERMES_HOME: /opt/data
      PATH: /opt/hermes/bin:/opt/hermes/.venv/bin:/usr/local/sbin:/usr/local/bin:/usr/sbin:/usr/bin:/sbin:/bin
    volumes:
      - hermes-data:/opt/data
      - x402_treazury-data:/var/lib/x402
      - type: bind
        source: ./data
        target: /persistent-data
        bind: {create_host_path: false}
      - type: bind
        source: ./components
        target: /opt/private-hermes
        read_only: true
        bind: {create_host_path: false}

  mcp-config:
    profiles: [maintenance]
    image: *hermes-image
    user: "0:0"
    network_mode: none
    working_dir: /opt/hermes
    entrypoint: [/opt/hermes/.venv/bin/python, /opt/private-hermes/provisioning/setup.py, mcp]
    command: [token]
    cap_drop: [ALL]
    cap_add: [CHOWN, FOWNER, DAC_OVERRIDE]
    security_opt: [no-new-privileges:true]
    read_only: true
    tmpfs: [/tmp:mode=1777]
    environment:
      HERMES_HOME: /opt/data
      PATH: /opt/hermes/bin:/opt/hermes/.venv/bin:/usr/local/sbin:/usr/local/bin:/usr/sbin:/usr/bin:/sbin:/bin
    volumes:
      - hermes-data:/opt/data
      - type: bind
        source: ./data
        target: /persistent-data
        bind: {create_host_path: false}
      - type: bind
        source: ./components
        target: /opt/private-hermes
        read_only: true
        bind: {create_host_path: false}

  tor:
    <<: *network
    command: [router]
    depends_on:
      setup: {condition: service_completed_successfully}
    environment:
      TOR_ONION_ENABLED: ${TOR_ONION_ENABLED:-false}
      PRIVATE_HERMES_X402_TREAZURY_SOCKS: "1"
    cap_add: [NET_ADMIN, SETUID, SETGID, SETPCAP, CHOWN, FOWNER, DAC_OVERRIDE]
    volumes:
      - type: bind
        source: ./data/tor
        target: /var/lib/tor
        bind: {create_host_path: false}
      - tor-x402_treazury:/run/tor-x402_treazury
      - ./components/network/torrc:/etc/tor/torrc:ro
    tmpfs:
      - /tmp:mode=1777
      - /run/tor-control:mode=0700
    networks:
      tor-uplink: {}
      onion-ingress:
        ipv4_address: 10.203.86.2
      agent-route:
        ipv4_address: 10.203.80.3
      executor-route:
        ipv4_address: 10.203.81.3
    healthcheck:
      test: [CMD, python3, /opt/tor-health.py]
      interval: 30s
      start_interval: 5s
      timeout: 5s
      start_period: 300s
      retries: 5

  agent-net:
    <<: *network
    command: [agent]
    depends_on:
      tor: {condition: service_healthy}
    volumes:
      - type: bind
        source: ./config/network/mcp-allowlist.json
        target: /etc/private-hermes/mcp-allowlist.json
        read_only: true
        bind:
          create_host_path: false
    networks:
      agent-route:
        ipv4_address: 10.203.80.2
      execution-control:
        ipv4_address: 10.203.82.2
      inference:
        ipv4_address: 10.203.83.2
      mcp-access:
        ipv4_address: 10.203.84.2
      webapp-backend:
        ipv4_address: 10.203.85.2

  executor-net:
    <<: *network
    command: [executor]
    depends_on:
      tor: {condition: service_healthy}
    networks:
      executor-route:
        ipv4_address: 10.203.81.2
      execution-control:
        ipv4_address: 10.203.82.3

  executor:
    extends:
      file: compose.executor.yaml
      service: executor-${COMPUTER_USE_ENABLED-false}
    image: private-hermes-executor:local
    build:
      context: .
      dockerfile: components/executor/Dockerfile
      target: executor-${COMPUTER_USE_ENABLED-false}
    network_mode: service:executor-net
    depends_on:
      setup: {condition: service_completed_successfully}
      executor-net: {condition: service_healthy}
    cap_drop: [ALL]
    # OpenSSH needs CHOWN to assign remote PTYs to runner; sessions drop capabilities.
    cap_add: [CHOWN, SETUID, SETGID, SYS_CHROOT]
    read_only: true
    environment:
      ANONYMIZED_TELEMETRY: "false"
      CUA_DRIVER_RS_TELEMETRY_ENABLED: "0"
    tmpfs: [/tmp:mode=1777, /run:mode=0755]
    volumes:
      - type: bind
        source: ./data/ssh/executor
        target: /run/executor-auth
        read_only: true
        bind: {create_host_path: false}
      - type: bind
        source: ./data/executor/home
        target: /home/runner
        bind: {create_host_path: false}
      - type: bind
        source: ./data/executor/workspace
        target: /workspace
        bind: {create_host_path: false}
      - ./components/executor/resolv.conf:/etc/resolv.conf:ro
    restart: unless-stopped
    healthcheck:
      test: [CMD-SHELL, "test -f /run/sshd.pid && kill -0 $$(cat /run/sshd.pid)"]
      interval: 10s
      start_interval: 1s
      timeout: 2s
      retries: 3
      start_period: 15s

  teep:
    image: private-hermes-teep:local
    command: "serve ${TEEP_SERVE_ARGS:-}"
    build:
      context: .
      dockerfile: components/teep/Dockerfile
    ports:
      - "127.0.0.1:${TEEP_HOST_PORT:-8337}:8337"
    environment:
      TEEP_LISTEN_ADDR: 0.0.0.0:8337
      VENICE_API_KEY: ${VENICE_API_KEY:-}
      NEARAI_API_KEY: ${NEARAI_API_KEY:-}
      CHUTES_API_KEY: ${CHUTES_API_KEY:-}
      TINFOIL_API_KEY: ${TINFOIL_API_KEY:-}
      NANOGPT_API_KEY: ${NANOGPT_API_KEY:-}
      PHALA_API_KEY: ${PHALA_API_KEY:-}
      HTTP_PROXY: ""
      HTTPS_PROXY: ""
      ALL_PROXY: ""
      http_proxy: ""
      https_proxy: ""
      all_proxy: ""
      HOME: /tmp
      XDG_CACHE_HOME: /tmp/cache
    networks:
      inference:
        ipv4_address: 10.203.83.3
      teep-uplink:
        gw_priority: 1
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]
    read_only: true
    tmpfs: [/tmp:mode=1777]
    restart: unless-stopped

  x402_treazury:
    profiles: [x402_treazury]
    stop_grace_period: -1s
    image: &x402-image private-hermes-x402_treazury:local
    init: true
    build:
      context: .
      dockerfile: components/x402_treazury/Dockerfile
    user: "10003:10003"
    group_add: ["102"]
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]
    read_only: true
    tmpfs: [/tmp:mode=1777]
    depends_on:
      tor: {condition: service_healthy}
      agent-net: {condition: service_healthy}
    network_mode: service:agent-net
    volumes:
      - tor-x402_treazury:/run/tor-x402_treazury:ro
      - type: bind
        source: ./data/x402_treazury-auth
        target: /run/x402_treazury-auth
        read_only: true
        bind: {create_host_path: false}
      - type: bind
        source: ./config/x402_treazury
        target: /opt/x402/examples/deployments
        read_only: true
        bind: {create_host_path: false}
      - x402_treazury-data:/var/lib/x402
    restart: unless-stopped

  x402_treazury-setup:
    profiles: [maintenance]
    image: *x402-image
    init: true
    user: "10003:10003"
    group_add: ["102"]
    network_mode: service:agent-net
    entrypoint: [python3, /opt/onboarding.py]
    command: [status]
    restart: "no"
    stop_grace_period: -1s
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]
    read_only: true
    tmpfs: [/tmp:mode=1777]
    volumes:
      - tor-x402_treazury:/run/tor-x402_treazury:ro
      - type: bind
        source: ./config/x402_treazury
        target: /opt/x402/examples/deployments
        read_only: true
        bind: {create_host_path: false}
      - x402_treazury-data:/var/lib/x402

  x402_treazury-inspect: &x402-offline
    profiles: [maintenance]
    image: *x402-image
    user: "10003:10003"
    network_mode: none
    entrypoint: [python3, /opt/onboarding.py]
    command: [status]
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]
    read_only: true
    # Offline wallet inspection reconstructs an encrypted snapshot in scratch space.
    tmpfs: [/tmp:mode=1777]
    volumes:
      - x402_treazury-data:/var/lib/x402

  x402_treazury-admin:
    <<: *x402-offline
    depends_on:
      setup: {condition: service_completed_successfully}
    volumes:
      - type: bind
        source: ./config/x402_treazury
        target: /opt/x402/examples/deployments
        read_only: true
        bind: {create_host_path: false}
      - x402_treazury-data:/var/lib/x402

  hermes-config:
    profiles: [maintenance]
    image: *hermes-image
    user: "10000:10000"
    network_mode: none
    entrypoint: [/opt/hermes/.venv/bin/hermes, config]
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]
    read_only: true
    tmpfs: [/tmp:mode=1777]
    environment:
      HOME: /opt/data
      HERMES_HOME: /opt/data
      WEBAPP_EXTERNAL_CONTENT: "off"
    volumes:
      - hermes-data:/opt/data

  hermes:
    image: *hermes-image
    build: *hermes-build
    network_mode: service:agent-net
    depends_on:
      setup: {condition: service_completed_successfully}
      agent-net: {condition: service_healthy}
      executor: {condition: service_healthy}
      teep: {condition: service_healthy}
    cap_drop: [ALL]
    cap_add: [CHOWN, DAC_OVERRIDE, FOWNER, KILL, SETUID, SETGID]
    security_opt: [no-new-privileges:true]
    volumes:
      - hermes-data:/opt/data
      - type: bind
        source: ./data/ssh/agent
        target: /run/agent-ssh
        read_only: true
        bind: {create_host_path: false}
      - ./components/hermes/ssh-client.conf:/etc/ssh/ssh_config.d/99-private-hermes.conf:ro
      - ./components/hermes/resolv.conf:/etc/resolv.conf:ro
    environment:
      COMPUTER_USE_ENABLED: ${COMPUTER_USE_ENABLED-false}
      WEBAPP_EXTERNAL_CONTENT: ${WEBAPP_EXTERNAL_CONTENT-tor_proxied}
      HERMES_UID: "10000"
      HERMES_GID: "10000"
      HERMES_DASHBOARD: "0"
      ANONYMIZED_TELEMETRY: "false"
      CUA_DRIVER_RS_TELEMETRY_ENABLED: "0"
      OPENAI_BASE_URL: http://10.203.83.3:8337/v1
      OPENAI_API_KEY: unused
      WEBAPP_TERMINAL_ENVIRONMENT: ${WEBAPP_TERMINAL_ENVIRONMENT-code}
      TERMINAL_SSH_HOST: 10.203.82.3
      TERMINAL_SSH_PORT: "2222"
      TERMINAL_SSH_USER: runner
      TERMINAL_SSH_KEY: /run/agent-ssh/id_ed25519
      NO_PROXY: 10.203.83.3,10.203.84.0/24,localhost,127.0.0.1
    command: [gateway, run]
    restart: unless-stopped

  onion-inspect:
    profiles: [maintenance]
    image: private-hermes-network:local
    entrypoint: [python3, /opt/onion.py]
    command: [inspect]
    network_mode: none
    user: "0:0"
    cap_drop: [ALL]
    cap_add: [DAC_OVERRIDE]
    security_opt: [no-new-privileges:true]
    read_only: true
    volumes:
      - type: bind
        source: ./data/tor
        target: /var/lib/tor
        read_only: true
        bind: {create_host_path: false}

  onion-init:
    profiles: [maintenance]
    image: private-hermes-network:local
    entrypoint: [python3, /opt/onion.py]
    command: [initialize]
    network_mode: none
    user: "0:0"
    cap_drop: [ALL]
    cap_add: [CHOWN, FOWNER, DAC_OVERRIDE, SETUID, SETGID, SETPCAP, KILL]
    security_opt: [no-new-privileges:true]
    read_only: true
    tmpfs: [/tmp:mode=1777]
    volumes:
      - type: bind
        source: ./data/tor
        target: /var/lib/tor
        bind: {create_host_path: false}

  webapp-proxy:
    image: private-hermes-webapp-proxy:local
    build:
      context: .
      dockerfile: components/webapp/proxy.Dockerfile
    # Startup installs a default-deny firewall, then irreversibly drops all
    # capabilities and switches to UID 10005 before executing HAProxy.
    user: "0:0"
    cap_drop: [ALL]
    cap_add: [NET_ADMIN, SETUID, SETGID, SETPCAP]
    security_opt: [no-new-privileges:true]
    read_only: true
    tmpfs: [/run:mode=0755]
    environment:
      WEBAPP_EXTERNAL_CONTENT: ${WEBAPP_EXTERNAL_CONTENT-tor_proxied}
      WEBAPP_PORT: ${WEBAPP_PORT:-9120}
      TAILSCALE_FUNNEL_ENABLED: ${TAILSCALE_FUNNEL_ENABLED:-false}
      TOR_ONION_ENABLED: ${TOR_ONION_ENABLED:-false}
    depends_on:
      agent-net: {condition: service_healthy}
    volumes:
      - type: bind
        source: ./config/webapp/proxy.cfg
        target: /usr/local/etc/haproxy/haproxy.cfg
        read_only: true
        bind: {create_host_path: false}
    ports:
      - "${WEBAPP_BIND:-127.0.0.1}:${WEBAPP_PORT:-9120}:${WEBAPP_PORT:-9120}"
    networks:
      webapp-backend:
        ipv4_address: 10.203.85.3
      webapp-publish: {}
      onion-ingress:
        ipv4_address: 10.203.86.3
    restart: unless-stopped

networks:
  onion-ingress:
    <<: *isolated
    ipam:
      config: [{subnet: 10.203.86.0/24}]
  tor-uplink: {}
  teep-uplink: {}
  agent-route:
    <<: *isolated
    ipam:
      config: [{subnet: 10.203.80.0/24}]
  executor-route:
    <<: *isolated
    ipam:
      config: [{subnet: 10.203.81.0/24}]
  execution-control:
    <<: *isolated
    ipam:
      config: [{subnet: 10.203.82.0/24}]
  inference:
    <<: *isolated
    ipam:
      config: [{subnet: 10.203.83.0/24}]
  mcp-access:
    <<: *isolated
    ipam:
      config: [{subnet: 10.203.84.0/24}]

  webapp-backend:
    <<: *isolated
    ipam:
      config: [{subnet: 10.203.85.0/24}]
  webapp-publish:
    driver_opts:
      com.docker.network.bridge.enable_ip_masquerade: "false"

volumes:
  # Named application volumes survive ordinary compose down/up.
  hermes-data: {}
  x402_treazury-data: {}
  tor-x402_treazury: {}
