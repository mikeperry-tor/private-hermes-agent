services:
  setup-storage:
    volumes:
      - type: bind
        source: ${TEST_DATA_DIR:?disposable test data required}
        target: /persistent-data
        bind: {create_host_path: false}
  mcp-config:
    volumes:
      - type: bind
        source: ${TEST_DATA_DIR:?disposable test data required}
        target: /persistent-data
        bind: {create_host_path: false}
  setup:
    environment:
      HERMES_DEFAULT_MODEL: ""
    volumes:
      - type: bind
        source: ./tests/fixtures/webapp
        target: /run/webapp
        read_only: true
        bind: {create_host_path: false}
      - type: bind
        source: ${TEST_DATA_DIR:?disposable test data required}
        target: /persistent-data
        bind: {create_host_path: false}
  webapp-proxy:
    profiles: [browser-test]
  hermes:
    user: "10000:10000"
    init: true
    entrypoint: [/bin/sleep]
    command: [infinity]
    cap_drop: [ALL]
    environment:
      HERMES_HOME: /opt/data
      AGENT_ONLY_SENTINEL: must-not-reach-executor
    volumes:
      - type: bind
        source: ${TEST_DATA_DIR:?disposable test data required}/ssh/agent
        target: /run/agent-ssh
        read_only: true
        bind: {create_host_path: false}
  teep:
    command: [serve]
    # Publish only on loopback, using a disposable port rather than the
    # operator's configured inference port.
    ports: !override
      - "127.0.0.1::8337"
    environment:
      VENICE_API_KEY: integration-placeholder-not-a-real-key
      NEARAI_API_KEY: ""
      CHUTES_API_KEY: ""
      TINFOIL_API_KEY: ""
      NANOGPT_API_KEY: ""
      PHALA_API_KEY: ""
  agent-net:
    volumes:
      - type: bind
        source: ./tests/fixtures/mcp-allowlist.json
        target: /etc/private-hermes/mcp-allowlist.json
        read_only: true
        bind:
          create_host_path: false
  fixture:
    image: private-hermes-executor:local
    user: "10000:10000"
    # The fixture binds port 111 without capabilities; Docker allows this by
    # default, Podman sets the floor to 1024.
    sysctls:
      net.ipv4.ip_unprivileged_port_start: 0
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]
    read_only: true
    command: [python3, /opt/fixture.py]
    volumes:
      - ./tests/fixtures/mcp.py:/opt/fixture.py:ro
    networks:
      mcp-access:
        ipv4_address: 10.203.84.10
      agent-route:
        ipv4_address: 10.203.80.10
  x402_treazury:
    profiles: !reset []
    # Real Rust server; test config has local catalogs, an ephemeral static key,
    # no treasury, no funding configuration, and only a free Tor-check API.
    depends_on:
      setup: {condition: service_completed_successfully}
    entrypoint: [python3, /opt/x402_treazury-fixture.py]
    working_dir: /tmp
    volumes:
      - type: bind
        source: ${TEST_DATA_DIR:?disposable test data required}/config/x402_treazury
        target: /opt/x402/examples/deployments
        read_only: true
        bind: {create_host_path: false}
      - ./tests/fixtures/x402_treazury.py:/opt/x402_treazury-fixture.py:ro
      - ./components/x402_treazury/endpoints.py:/opt/endpoints.py:ro
      - type: bind
        source: ${TEST_DATA_DIR:?disposable test data required}/x402_treazury-auth
        target: /run/x402_treazury-auth
        read_only: true
        bind: {create_host_path: false}
  tor:
    volumes:
      - type: bind
        source: ${TEST_DATA_DIR:?disposable test data required}/tor
        target: /var/lib/tor
        bind: {create_host_path: false}
  executor:
    volumes:
      - type: bind
        source: ${TEST_DATA_DIR:?disposable test data required}/ssh/executor
        target: /run/executor-auth
        read_only: true
        bind: {create_host_path: false}
      - type: bind
        source: ${TEST_DATA_DIR:?disposable test data required}/executor/home
        target: /home/runner
        bind: {create_host_path: false}
      - type: bind
        source: ${TEST_DATA_DIR:?disposable test data required}/executor/workspace
        target: /workspace
        bind: {create_host_path: false}
  x402_treazury-admin:
    # Offline creation qualification needs the scratch filesystem used by the
    # production job. Production admin only performs offline inspection.
    tmpfs: [/tmp:mode=1777]
    volumes:
      - type: bind
        source: ${TEST_DATA_DIR:?disposable test data required}/config/x402_treazury
        target: /opt/x402/examples/deployments
        read_only: true
        bind: {create_host_path: false}
      - ./tests/fixtures/storage-check.py:/opt/storage-check.py:ro
  x402_treazury-setup:
    volumes:
      - type: bind
        source: ${TEST_DATA_DIR:?disposable test data required}/config/x402_treazury
        target: /opt/x402/examples/deployments
        read_only: true
        bind: {create_host_path: false}
